<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50">

    <!-- login page -->

    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gray-50">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full mx-4">
            <div class="text-center mb-8">
                <svg class="w-20 h-20 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.868-.013-1.703-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.547 2.911 1.186.092-.924.35-1.546.638-1.903-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.268 2.75 1.024A9.578 9.578 0 0110 4.836c.85.004 1.705.114 2.504.336 1.909-1.292 2.747-1.024 2.747-1.024.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C17.138 18.163 20 14.414 20 10c0-5.523-4.477-10-10-10z" clip-rule="evenodd" />
                </svg>
                <h1 class="text-3xl font-bold text-gray-900">GitHub Issues Tracker</h1>
                <p class="text-gray-600 text-sm mt-2">Sign in to manage your issues</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <input type="text" id="username" placeholder="Enter Username"
                        autocomplete="username"
                        aria-label="Username"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 transition">
                    <p class="text-sm text-blue-600 mt-1">Default: <span class="font-semibold">admin</span></p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" placeholder="Enter Password"
                        autocomplete="current-password"
                        aria-label="Password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 transition">
                    <p class="text-sm text-blue-600 mt-1">Default: <span class="font-semibold">admin123</span></p>
                </div>

                <button type="submit" aria-label="Sign in to your account"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition">
                    Sign In
                </button>
            </form>

            <div class="my-6 flex items-center">
                <div class="flex-1 border-t border-gray-300"></div>
                <div class="px-3 text-gray-600 text-sm">OR</div>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg text-center">
                <p class="text-sm text-gray-700 font-semibold mb-2">Demo Credentials:</p>
                <p class="text-sm text-gray-600"><span class="font-semibold">Username:</span> admin</p>
                <p class="text-sm text-gray-600"><span class="font-semibold">Password:</span> admin123</p>
            </div>

            <p class="text-xs text-gray-500 text-center mt-4">💡 Tip: Press <kbd class="bg-gray-200 px-2 py-1 rounded">?</kbd> for keyboard shortcuts</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
